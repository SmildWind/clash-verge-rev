name: Format Traffic Branch

on:
  push:
    branches:
      - traffic-aggregate-memory

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout traffic branch
        uses: actions/checkout@v7
        with:
          ref: traffic-aggregate-memory

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Apply small lint fixes
        run: |
          node <<'JS'
          const fs = require('fs')

          const hookPath = 'src/hooks/use-connection-data.ts'
          let hook = fs.readFileSync(hookPath, 'utf8')

          hook = hook.replace(
            "const notifyConnectionListeners = () => {\n  connectionListeners.forEach((listener) => listener())\n}\n\nconst notifySummaryListeners = () => {\n  summaryListeners.forEach((listener) => listener())\n}\n",
            "const notifyConnectionListeners = () => {\n  connectionListeners.forEach((listener) => {\n    listener()\n  })\n}\n\nconst notifySummaryListeners = () => {\n  summaryListeners.forEach((listener) => {\n    listener()\n  })\n}\n",
          )

          const groupStart = hook.indexOf('const getAggregateGroups = (chains: string[]) => {')
          const groupEnd = hook.indexOf('\n\nconst getAggregateKey', groupStart)
          if (groupStart >= 0 && groupEnd > groupStart) {
            const groupBlock = `const getAggregateGroups = (chains: string[]) => {
  const groups: string[] = []
  for (let i = chains.length - 1; i >= 1; i--) {
    addUniqueText(groups, normalizeGroup(chains[i]))
  }
  if (chains[0] === 'DIRECT') addUniqueText(groups, 'DIRECT')
  if (groups.length === 0) addUniqueText(groups, chains[0] || UNKNOWN_GROUP)
  return groups
}`
            hook = hook.slice(0, groupStart) + groupBlock + hook.slice(groupEnd)
          }

          hook = hook.replace(
            /getAggregateGroups\(chains\)\.forEach\(\(group\) =>\s*addUniqueText\(item\.groups, group\),\s*\)/s,
            "getAggregateGroups(chains).forEach((group) => {\n    addUniqueText(item.groups, group)\n  })",
          )
          hook = hook.replace(
            'keysToDelete.forEach((key) => aggregateByKey.delete(key))',
            "keysToDelete.forEach((key) => {\n    aggregateByKey.delete(key)\n  })",
          )
          fs.writeFileSync(hookPath, hook)

          const pagePath = 'src/pages/connections.tsx'
          let page = fs.readFileSync(pagePath, 'utf8')
          page = page.replace(
            "import {\n  ConnectionDetail,\n  ConnectionDetailRef,\n} from '@/components/connection/connection-detail'",
            "import {\n  ConnectionDetail,\n  type ConnectionDetailRef,\n} from '@/components/connection/connection-detail'",
          )
          page = page.replace(
            'const detailRef = useRef<ConnectionDetailRef>(null!)',
            'const detailRef = useRef<ConnectionDetailRef | null>(null)',
          )
          fs.writeFileSync(pagePath, page)
          JS

      - name: Format source
        run: pnpm format

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format traffic aggregation changes"
          git push origin HEAD:traffic-aggregate-memory
