name: Auto Format Traffic Branch

on:
  push:
    branches:
      - traffic-aggregate-memory

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: traffic-aggregate-memory

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Format source
        run: pnpm format

      - name: Remove temporary formatter workflow
        run: git rm --ignore-unmatch .github/workflows/auto-format-traffic.yml

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format traffic aggregation changes"
          git push origin HEAD:traffic-aggregate-memory
